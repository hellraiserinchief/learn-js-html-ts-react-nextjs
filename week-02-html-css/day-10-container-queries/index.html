<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day 10 — Container queries</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <p>Drag the bottom-right corner of the box to resize. The card adapts to its <em>container</em>, not the viewport.</p>
    <div class="resizable">
      <div class="card-wrapper">
        <article class="card">
          <div class="thumb"></div>
          <div class="body">
            <h3>Container-aware card</h3>
            <p>Stacks when narrow. Side-by-side when wide.</p>
          </div>
        </article>
      </div>
    </div>
  </body>
